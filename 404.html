<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMRATS - Em Manutenção</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #474a51;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        
        .logo {
            margin-bottom: 40px;
        }
        
        .logo img {
            max-width: 300px;
            width: 100%;
            height: auto;
        }
        
        .texto {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .texto p {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .verde {
            color: #27ae60;
            font-weight: bold;
        }
        
        .mensagem {
            font-size: 32px;
            margin-top: 40px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="logo">
        <!-- Logo white.png da raiz do projeto -->
        <img src="LOGO WHITE.png" alt="GYMRATS Logo">
    </div>
    
    <div class="texto">
        <p>Não é só um desafio</p>
        <p>É o novo <span class="verde">GYM RATS</span></p>
    </div>
    
    <div class="mensagem">
        <p>Voltamos em Breve</p>
    </div>
</body>
</html>
